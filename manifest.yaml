id: "kandev-plugin-slack"
api_version: 1
min_kandev_version: "0.92.0"
version: "0.2.0-fork.1"
display_name: "Slack"
description: "Turn Slack conversations into Kandev tasks, and answer agent questions from Slack. Mention @Kandev or run /kandev and a utility agent triages the thread into the right workspace, workflow and column. Questions an agent asks are posted as a thread; your reply answers them."
author: "kandev"
categories: ["connector", "automation"]
repo_url: "https://github.com/kdlbs/kandev-plugin-slack"
icon: "assets/icon.svg"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  # The poll watermark (per-channel last-seen Slack ts) and the last probe
  # result live in Host state so a restart resumes instead of re-triaging.
  state: true
  # Credentials arrive through config_schema secret fields; GetConfig hands
  # the subprocess the cleartext values.
  secrets: true
  # Triage is one non-interactive completion per matched message.
  agent_invoke: true
  # The triage prompt is built from the real Kandev topology so the agent
  # picks an existing workspace/workflow/column rather than inventing one.
  # Clarification threads read pending agent questions (interactions) and the
  # asking task's title and workspace (tasks) to pick the channel.
  api_read: ["workspaces", "workflows", "repositories", "tasks", "interactions"]
  api_write: ["tasks"]

agent_tools:
  - name: notify_user
    description: "Send one plain-text Slack DM. Use a stable key per notification event. Repeats return the stored outcome. Never retry an uncertain outcome with a new key. The caller owns user mapping and task links."
    surfaces: [kanban-task, office-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [recipient, message, idempotency_key]
      properties:
        recipient:
          type: string
          pattern: '^[UW][A-Z0-9]{8,31}$'
          description: "One mapped Slack user ID; channel IDs and user lists are forbidden."
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: "Plain text, at most 4000 UTF-8 bytes. Include the card URL. No mentions or angle brackets."
        idempotency_key:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'
          description: "Stable notification event key, scoped by the host workspace and recipient."
    output_schema:
      type: object
      additionalProperties: false
      required: [recipient, status, code, detail, duplicate]
      properties:
        recipient: {type: string}
        status:
          type: string
          enum: [delivered, failed, uncertain, rejected]
        code: {type: string}
        detail: {type: string}
        duplicate: {type: boolean}
        channel: {type: string}
        message_ts: {type: string}
        retry_after_seconds: {type: integer, minimum: 0}
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true

webhooks:
  - key: "status"
    description: "Connection status, detected auth mode, and recent triage activity (UI relay, not an external webhook)"
    method: "GET"
  - key: "test"
    description: "Probe the stored credentials with Slack auth.test (UI relay, not an external webhook)"
    method: "POST"
  - key: "scan"
    description: "Run one fallback-mode scan immediately instead of waiting for the next poll (UI relay, not an external webhook)"
    method: "POST"

config_schema:
  type: object
  properties:
    app_token:
      type: string
      secret: true
      title: "App-level token"
      description: "xapp- token from Basic Information > App-Level Tokens, with the connections:write scope. Opens the Socket Mode connection so Slack can push events without Kandev needing a public URL."
    bot_token:
      type: string
      secret: true
      title: "Bot token"
      description: "xoxb- Bot User OAuth Token from OAuth & Permissions. Used for triage replies and task notifications. Direct messages require the chat:write and im:write bot scopes. After adding a scope, reinstall the Slack app into your workspace to grant it."
    utility_agent:
      type: string
      format: utility-agent
      title: "Triage agent"
      description: "The utility agent that reads the Slack thread and decides which workspace, workflow and column the task belongs in."
    start_agent:
      type: boolean
      default: false
      title: "Start agent on the new task"
      description: "Launch an agent on the task as soon as triage creates it, instead of leaving it queued on the board."
    session_token:
      type: string
      secret: true
      title: "Fallback: browser session token"
      description: "The xoxc- token from a logged-in Slack tab, for workspaces that forbid app installs. This unofficial fallback polls for inbound triage only. It does not support task notifications. Leave empty when using a Slack app."
    session_cookie:
      type: string
      secret: true
      title: "Fallback: browser d cookie"
      description: "The `d` cookie from the same Slack tab as the session token. Required only for the fallback."
    command_prefix:
      type: string
      default: "!kandev"
      title: "Fallback: command prefix"
      description: "Fallback only. Messages starting with this marker are triaged. A Slack app is addressed with @Kandev or /kandev instead, so this is ignored."
    channels:
      type: string
      title: "Fallback: channels"
      description: "Fallback only. Comma-separated channel IDs to narrow the search. A Slack app receives events for every channel it is invited to."
    poll_interval_seconds:
      type: integer
      default: 30
      title: "Fallback: poll interval (seconds)"
      description: "Fallback only, between 5 and 600. A Slack app is event-driven and never polls."
    questions_enabled:
      type: boolean
      default: false
      title: "Clarification threads: post agent questions to Slack"
      description: "When an agent asks you questions (ask_user_question_kandev), post them to Slack as a thread; a reply from an allowed user answers them and the agent resumes. Needs the Slack app (not the fallback), the message.channels/message.groups events and a Kandev URL."
    kandev_url:
      type: string
      title: "Clarification threads: Kandev URL"
      description: "Base URL the plugin sends answers to, from the machine Kandev runs on, e.g. http://127.0.0.1:3040. Answers go through POST /api/v1/clarification/<pending_id>/respond, the same path as the answer_question_kandev tool."
    kandev_api_token:
      type: string
      secret: true
      title: "Clarification threads: Kandev API token"
      description: "A Kandev personal access token (kandev_pat_…) used to submit answers. Leave empty only when Kandev runs with authentication disabled. Answers are recorded as this token's user."
    kandev_public_url:
      type: string
      title: "Clarification threads: public Kandev URL (optional)"
      description: "When set, the task title in the Slack post links to <this URL>/t/<task id>. Use the address you open Kandev with from Slack, e.g. https://kandev.example.com."
    questions_default_channel:
      type: string
      title: "Clarification threads: default channel"
      description: "Channel id (C…) that receives questions from workspaces with no mapping below. Invite the bot there."
    questions_channels:
      type: string
      title: "Clarification threads: workspace → channel"
      description: "One workspace=channel pair per line or comma, where workspace is its id or name and channel is a channel id, e.g. Homelab=C0123456789."
    questions_answerers:
      type: string
      title: "Clarification threads: allowed Slack users"
      description: "Comma-separated Slack user ids (U…) whose thread replies answer questions. Replies from anyone else are ignored."
    questions_poll_seconds:
      type: integer
      default: 10
      title: "Clarification threads: check interval (seconds)"
      description: "How often to look for new questions, between 3 and 300. Kandev has no event for a new question, so the plugin checks the pending list."
  required: ["utility_agent"]

ui:
  bundle: "/ui/bundle.js"
