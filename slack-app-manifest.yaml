# Paste this into Slack: api.slack.com/apps → Create New App → From a manifest.
#
# socket_mode_enabled means Slack pushes events down a WebSocket instead of
# POSTing to a request URL, so this imports cleanly with no public HTTPS
# endpoint — which is the point, since Kandev usually runs on localhost.
#
# After creating the app:
#   1. Basic Information → App-Level Tokens → Generate, scope `connections:write`
#      → this is the `xapp-` token.
#   2. Install to Workspace → OAuth & Permissions → Bot User OAuth Token
#      → this is the `xoxb-` token.
#   3. Invite the bot to the channels you want it to read: /invite @Kandev
#
# Scope changes only take effect on reinstall — if you edit this manifest
# later, reinstall the app afterwards.
display_information:
  name: Kandev
  description: Turn Slack conversations into Kandev tasks.
  background_color: "#1f1d2b"

features:
  bot_user:
    display_name: Kandev
    always_online: false
  slash_commands:
    - command: /kandev
      description: Create a Kandev task from this conversation
      usage_hint: "[what needs doing]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      # Receive @Kandev mentions.
      - app_mentions:read
      # Read the surrounding thread, or the recent channel conversation when a
      # mention is not threaded, for context. Also required for the
      # message.channels / message.groups events that deliver replies to
      # clarification threads. groups: covers private channels; drop it if
      # the bot only ever works in public ones.
      - channels:history
      - groups:history
      # Post the triage reply.
      - chat:write
      # Open a direct message with one notification recipient.
      - im:write
      # Add the :eyes: acknowledgement while triage runs, and the
      # :white_check_mark: on a reply that answered an agent's questions.
      - reactions:write
      # Serve /kandev.
      - commands

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      # Replies in clarification threads (public / private channels). The
      # plugin ignores every message that is not a reply in a thread it
      # posted.
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
